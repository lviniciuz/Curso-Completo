<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estilizando formulários</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
<h1>Estilizando formulários</h1>
    <form action="">
        <fieldset> <!-- (Utilizado para agrupar dados semelhantes) -->
        <legend>Detalhes de contato</legend>
        
            <div>
                <label for="nome"> <!-- (Etiqueta ou rotulo, serve para se o usuario clicar no "nome" ele tambem clica automaticamente no campo de texto) -->
                    Nome:</label> 
                    <input type="text" name"name" id="nome">
            </div>

            <div>
                <label for="email"> <!-- (Etiqueta ou rotulo, serve para se o usuario clicar no "nome" ele tambem clica automaticamente no campo de texto) -->
                    Email:</label> 
                    <input type="text" name"email" id="email">
            </div>

            <div>
                <label for="url"> <!-- (Etiqueta ou rotulo, serve para se o usuario clicar no "nome" ele tambem clica automaticamente no campo de texto) -->
                    Url:</label> 
                    <input type="text" name"url" id="url">
            </div>
        </fieldset>
        <fieldset>
            <legend>Comentários</legend>
            <div>
                <label for="">
                    Mensagem
                </label>
                <textarea name="Mensagem" id="Mensagem"></textarea>
            </div>
        </fieldset>
        <fieldset>
            <legend>Lembrar de mim</legend>
        <div>
            <label for="Sim">
                <input type="radio"  class="radio name="lembrar" id="Sim">Sim
            </label>
        </div>
        <div>
            <label for="Não">
                <input class="radio" type="radio" name="lembrar" id="Não">Não
            </label>
        </div>
        </fieldset>

    </form>

</header>
</body>
</html>
